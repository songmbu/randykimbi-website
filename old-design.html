<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Randy Kimbi — Sep 20 design preview</title>
</head>
<body>
<script>
(async function(){
  var b="https://raw.githubusercontent.com/songmbu/randykimbi-website/0da099f/";
  var h=await fetch(b+"index.html").then(function(r){return r.text();});
  var c=await fetch(b+"css/main.css").then(function(r){return r.text();});
  var o=h.replace('<link rel="stylesheet" href="/css/main.css">','<base href="https://www.randykimbi.com/"><style>'+c+'</style>');
  o=o.replace(/<script src="\/js\/app.js"><\/script>/,"");
  document.open();document.write(o);document.close();
})();
</script>
</body>
</html>
