<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Randy Kimbi | AI Consultancy & Corporate Training</title>
  <meta name="description" content="Contact Randy Kimbi. Start with the free AI assessment, message on WhatsApp, or reach out by email or phone.">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .contact-cols{display:grid;grid-template-columns:0.9fr 1.1fr;gap:clamp(30px,5vw,64px);align-items:center}
    .contact-photo img{width:100%;height:auto;display:block;border:1px solid var(--line-on-paper);border-radius:3px}
    .cxa{display:flex;align-items:center;gap:16px;border:1px solid var(--line-on-paper);border-radius:6px;padding:16px 20px;margin-bottom:14px;transition:transform .25s ease,border-color .25s ease}
    .cxa:hover{transform:translateY(-2px);border-color:var(--gold)}
    .cxa.primary{background:var(--gold);border-color:var(--gold)}
    .cxa .ic{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
    .cxa.primary .ic{background:var(--ink-deep)}
    .cxa .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .cxa .tx .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--charcoal-dim)}
    .cxa.primary .tx .k{color:var(--ink-deep)}
    .cxa .tx .val{font-family:var(--display);font-size:18px;color:var(--ink)}
    .cxa .go{margin-left:auto;color:var(--gold);font-size:18px}
    .cxa.primary .go{color:var(--ink-deep)}
    .cnote{font-size:13px;color:var(--charcoal-dim);margin-top:18px}
    @media(max-width:820px){.contact-cols{grid-template-columns:1fr}.contact-photo{max-width:360px;margin:0 auto}}
  </style>
</head>
<body>
  <header><div class="header-content"><div class="logo">Randy Kimbi</div><nav><ul><li><a href="/">Home</a></li></ul></nav></div></header>

  <section class="hero text-center">
    <div class="container"><div class="hero-grid centered"><div>
      <span class="eyebrow center">Contact</span>
      <h1>Let's <em>talk.</em></h1>
      <p>Start with the free assessment, or reach Randy directly.</p>
    </div></div></div>
  </section>

  <section>
    <div class="container">
      <div class="contact-cols">
        <figure class="contact-photo" style="margin:0"><img src="/images/randy-contact.jpg" alt="Randy Kimbi"></figure>
        <div>
          <a class="cxa primary" href="/assessment/">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg></span>
            <span class="tx"><span class="k">Recommended</span><span class="val">Take the Free AI Assessment</span></span>
            <span class="go">&rarr;</span>
          </a>
          <a class="cxa" href="https://wa.me/237671283217?text=Hello%20Randy%2C%20I%20would%20like%20to%20talk%20about%20AI%20for%20my%20organisation." target="_blank" rel="noopener">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg></span>
            <span class="tx"><span class="k">WhatsApp</span><span class="val">Message Randy</span></span>
            <span class="go">&rarr;</span>
          </a>
          <a class="cxa" href="mailto:hello@randykimbi.com">
            <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
            <span class="tx"><span class="k">Email</span><span class="val">hello@randykimbi.com</span></span>
            <span class="go">&rarr;</span>
          </a>
          <a class="cxa" href="tel:+237671283217">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7A2 2 0 0 1 22 16.9z"/></svg></span>
            <span class="tx"><span class="k">Telephone</span><span class="val">+237 671 283 217</span></span>
            <span class="go">&rarr;</span>
          </a>
          <p class="cnote">Looking for a paid consultation? Use the <a href="/services/consultancy/" style="color:var(--gold);border-bottom:1px solid var(--gold)">AI Consultancy</a> booking form.</p>
        </div>
      </div>
    </div>
  </section>

  <footer></footer>
  <script src="/js/app.js"></script>
</body>
</html>
