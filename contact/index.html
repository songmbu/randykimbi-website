<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Randy Kimbi | AI Consultancy & Corporate Training</title>
<meta name="description" content="Contact Randy Kimbi. Start with the free AI assessment, message on WhatsApp, or reach out by email or phone.">
<link rel="stylesheet" href="/css/main.css">
<style>
:root{--maxw:1180px}
*{box-sizing:border-box}
section{padding:clamp(60px,9vh,110px) 0;position:relative;overflow:hidden}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(22px,5vw,60px)}
.ink{background:var(--ink);color:var(--bone)} .ink h1,.ink h2{color:#fff}
.aurora::before{content:"";position:absolute;inset:-25% -15%;z-index:0;pointer-events:none;background:radial-gradient(40% 46% at 16% 24%,rgba(212,175,55,.14),transparent 66%),radial-gradient(42% 50% at 86% 74%,rgba(74,108,140,.24),transparent 68%);filter:blur(28px);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(3%,-3%,0) scale(1.09)}}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.16,.8,.24,1),transform .8s cubic-bezier(.16,.8,.24,1)}
.reveal.in{opacity:1;transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}.d4{transition-delay:.32s}

.chero{text-align:center;position:relative;z-index:2}
.chero .eyebrow-line{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
.chero h1{font-family:var(--display);font-weight:600;font-size:clamp(40px,6vw,72px);line-height:1;letter-spacing:-.03em;margin:0}
.chero p{font-size:clamp(16px,1.3vw,19px);color:var(--bone-dim);margin:18px auto 0;max-width:30em}

.cgrid{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(30px,5vw,60px);align-items:center}
.cphoto{position:relative;aspect-ratio:4/5;overflow:hidden;border:2px solid rgba(212,175,55,.5)}
.cphoto img{width:100%;height:100%;object-fit:cover;object-position:top center}

.cxa{display:flex;align-items:center;gap:18px;border:2px solid var(--ink);border-radius:10px;padding:18px 22px;margin-bottom:14px;text-decoration:none;transition:transform .28s ease,background .28s ease,color .28s ease}
.cxa:hover{transform:translateY(-2px);background:var(--ink)}
.cxa:hover .val{color:#fff}
.cxa .ic{flex:0 0 auto;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cxa .ic svg{width:26px;height:26px}
.cxa .val{font-family:var(--display);font-weight:600;font-size:clamp(17px,1.5vw,20px);color:var(--ink);letter-spacing:-.01em}
.cxa .go{margin-left:auto;color:var(--gold);font-size:20px;transition:transform .28s ease}
.cxa:hover .go{transform:translateX(5px)}

.ic-assess{background:var(--gold)}.ic-assess svg{stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic-wa{background:#25D366}.ic-wa svg{fill:#fff}
.ic-mail{background:var(--ink)}.ic-mail svg{stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-tel{background:var(--ink)}.ic-tel svg{fill:#fff}
.cxa:hover .ic-mail,.cxa:hover .ic-tel{background:var(--gold)}
.cxa:hover .ic-mail svg{stroke:var(--ink)}
.cxa:hover .ic-tel svg{fill:var(--ink)}

.cnote{font-size:14px;color:var(--charcoal);margin-top:20px}
.cnote a{color:var(--gold);border-bottom:1px solid var(--gold);text-decoration:none}

@media(max-width:820px){
  .cgrid{grid-template-columns:1fr}
  .cphoto{max-width:340px;margin:0 auto}
  .cxa .val{font-size:17px}
}
@media(max-width:560px){section{padding:clamp(46px,7vh,64px) 0}}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.aurora::before{animation:none}}
</style>
</head>
<body>
<header id="site-header"></header>
<main>

  <section class="ink aurora">
    <div class="wrap chero reveal">
      <p class="eyebrow-line">Contact</p>
      <h1>Let&rsquo;s talk.</h1>
      <p>Start with the free assessment, or reach me directly.</p>
    </div>
  </section>

  <section class="paper">
    <div class="wrap">
      <div class="cgrid">
        <div class="cphoto reveal"><img src="/images/randy-contact.jpg" alt="Randy Kimbi"></div>
        <div>
          <a class="cxa reveal" href="/assessment/">
            <span class="ic ic-assess"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
            <span class="val">Take the Free AI Assessment</span>
            <span class="go">&rarr;</span>
          </a>
          <a class="cxa reveal d1" href="https://wa.me/237671283217?text=Hello%20Randy%2C%20I%20would%20like%20to%20talk%20about%20AI%20for%20my%20organisation." target="_blank" rel="noopener">
            <span class="ic ic-wa"><svg viewBox="0 0 32 32"><path d="M16.04 4C9.96 4 5.02 8.94 5.02 15.02c0 1.94.51 3.84 1.48 5.51L4.8 27l6.63-1.66a11 11 0 0 0 4.6 1.02h.01c6.08 0 11.02-4.94 11.02-11.02C27.06 8.94 22.12 4 16.04 4zm6.46 15.56c-.27.77-1.58 1.47-2.18 1.55-.56.08-1.27.12-2.05-.13-.47-.15-1.08-.35-1.86-.69-3.27-1.41-5.4-4.7-5.57-4.92-.16-.22-1.33-1.77-1.33-3.38 0-1.61.85-2.4 1.15-2.73.3-.33.65-.41.87-.41.22 0 .43 0 .62.01.2.01.47-.08.73.56.27.65.92 2.26 1 2.42.08.16.13.35.03.56-.1.22-.16.35-.31.54-.16.19-.33.42-.47.56-.16.16-.32.33-.14.64.18.31.8 1.32 1.72 2.14 1.18 1.05 2.18 1.38 2.49 1.53.31.16.49.13.67-.08.18-.21.77-.9.98-1.21.2-.31.41-.26.69-.16.27.1 1.74.82 2.04.97.3.15.49.22.56.35.08.12.08.72-.19 1.49z"/></svg></span>
            <span class="val">Chat on WhatsApp</span>
            <span class="go">&rarr;</span>
          </a>
          <a class="cxa reveal d2" href="mailto:hello@randykimbi.com">
            <span class="ic ic-mail"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
            <span class="val">hello@randykimbi.com</span>
            <span class="go">&rarr;</span>
          </a>
          <a class="cxa reveal d3" href="tel:+237671283217">
            <span class="ic ic-tel"><svg viewBox="0 0 24 24"><path d="M20 15.5c-1.2 0-2.4-.2-3.5-.6a1 1 0 0 0-1 .2l-1.5 1.5a15.1 15.1 0 0 1-6.6-6.6l1.5-1.5a1 1 0 0 0 .2-1C8.7 6.4 8.5 5.2 8.5 4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1 17 17 0 0 0 17 17 1 1 0 0 0 1-1v-3.5a1 1 0 0 0-1-1z"/></svg></span>
            <span class="val">+237 671 283 217</span>
            <span class="go">&rarr;</span>
          </a>
          <p class="cnote reveal d4">Looking for a paid consultation? Use the <a href="/services/consultancy/">AI Consultancy</a> booking form.</p>
        </div>
      </div>
    </div>
  </section>

</main>
<footer id="site-footer"></footer>
<script src="/js/app.js"></script>
<script>
(function(){
  var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var revs=document.querySelectorAll('.reveal');
  if(rm){revs.forEach(function(e){e.classList.add('in');});return;}
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:0.14});
    revs.forEach(function(e){io.observe(e);});
    setTimeout(function(){revs.forEach(function(e){e.classList.add('in');});},2600);
  } else { revs.forEach(function(e){e.classList.add('in');}); }
})();
</script>
</body>
</html>
